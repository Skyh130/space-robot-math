# GitHub Pages 배포.
#
# 저장소 브랜치를 그대로 서빙하면 index.html 이 /src/main.tsx 를 부르는데,
# 브라우저는 TypeScript 를 실행하지 못해 빈 화면이 뜬다.
# 빌드한 dist/ 를 올려야 한다.
#
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 이 워크플로가 쓰인다.
name: Deploy

on:
  push:
    branches: [main, claude/phase-0-implementation-c7pyqi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 도중에 새 커밋이 오면 지금 것을 끝내고 다음으로 간다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 문제가 틀린 채로 배포되면 안 된다. 테스트를 통과해야 나간다.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
